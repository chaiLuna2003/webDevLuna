      <rect width="260" height="104" rx="18" fill="url(#panel)" stroke="#a78bfa" stroke-opacity=".24"/>
      <text x="22" y="34" fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="13">EXPEDIENTES</text>
      <text x="22" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">100%</text>
      <path d="M194 72l13-14 11 8 20-27" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(250 246)">
