      <text x="22" y="32" fill="#d9e8ec" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Agenda de atención</text>
      <g transform="translate(22 52)">
        <rect width="716" height="1" fill="#29414d"/>
        <circle cx="35" cy="34" r="17" fill="#14b8a6"/>
        <rect x="70" y="17" width="142" height="12" rx="6" fill="#d7e9ed" opacity=".8"/>
        <rect x="70" y="41" width="88" height="9" rx="4.5" fill="#6f8992"/>
        <rect x="584" y="20" width="104" height="28" rx="14" fill="#0f766e"/>
        <text x="603" y="39" fill="#ccfbf1" font-family="Inter,Arial,sans-serif" font-size="11">CONFIRMADA</text>
      </g>
    </g>
  </g>
