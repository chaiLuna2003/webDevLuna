<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Vista conceptual de SW Clínico</title>
  <desc id="desc">Composición visual de un panel clínico con agenda, pacientes y métricas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#001018" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1070" cy="-10" r="270" fill="#2dd4bf" opacity=".14"/>
  <circle cx="80" cy="660" r="260" fill="#38bdf8" opacity=".10"/>
  <g transform="translate(70 62)">
    <g fill="none" stroke="#5eead4" stroke-width="12" stroke-linecap="round">
      <path d="M36 0v72M0 36h72"/>
    </g>
    <text x="98" y="31" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">SW Clínico</text>
    <text x="98" y="62" fill="#99f6e4" font-family="Inter,Arial,sans-serif" font-size="17">Gestión médica integral</text>
  </g>
  <g transform="translate(70 176)" filter="url(#shadow)">
    <rect width="1060" height="425" rx="26" fill="#07141f"/>
    <rect width="210" height="425" rx="26" fill="#0b2432"/>
    <circle cx="42" cy="45" r="13" fill="#2dd4bf"/>
    <rect x="69" y="35" width="92" height="20" rx="10" fill="#d5fffa" opacity=".82"/>
    <g fill="#8fb5bd">
      <rect x="30" y="105" width="142" height="14" rx="7"/>
      <rect x="30" y="151" width="122" height="14" rx="7" opacity=".72"/>
      <rect x="30" y="197" width="136" height="14" rx="7" opacity=".72"/>
      <rect x="30" y="243" width="106" height="14" rx="7" opacity=".72"/>
    </g>
    <text x="250" y="58" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Resumen de atención</text>
    <text x="250" y="86" fill="#78909c" font-family="Inter,Arial,sans-serif" font-size="14">Información clínica centralizada y accesible por rol</text>
    <g transform="translate(250 116)">
      <rect width="230" height="104" rx="18" fill="url(#panel)" stroke="#2dd4bf" stroke-opacity=".24"/>
      <text x="22" y="34" fill="#99f6e4" font-family="Inter,Arial,sans-serif" font-size="13">CITAS DE HOY</text>
      <text x="22" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">24</text>
      <circle cx="188" cy="57" r="25" fill="#2dd4bf" opacity=".18"/>
      <path d="M179 57h18M188 48v18" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(500 116)">
      <rect width="230" height="104" rx="18" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".24"/>
      <text x="22" y="34" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="13">PACIENTES</text>
      <text x="22" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">148</text>
      <circle cx="188" cy="57" r="25" fill="#38bdf8" opacity=".16"/>
      <circle cx="188" cy="51" r="8" fill="none" stroke="#7dd3fc" stroke-width="3"/>
      <path d="M174 72c4-13 24-13 28 0" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    </g>
